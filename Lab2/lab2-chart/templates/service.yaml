apiVersion: v1
kind: Service
metadata:
  name: {{ include "lab2-api.fullname" . }}
  labels:
    {{- include "lab2-api.labels" . | nindent 4 }}
    app.kubernetes.io/part-of: lab2-stack
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "lab2-api.selectorLabels" . | nindent 4 }}
