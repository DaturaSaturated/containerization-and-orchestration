deploymentMode: SingleBinary
singleBinary:
  replicas: 1
  persistence:
    enabled: true
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
