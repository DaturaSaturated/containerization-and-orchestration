apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: trusted-registries
spec:
  validationFailureAction: Enforce
  background: false
  rules:
  - name: check-registry
    match:
      any:
      - resources:
          kinds:
          - Pod
    validate:
      message: "Образы только из docker.io, gcr.io, ghcr.io"
      pattern:
        spec:
          containers:
          - image: "docker.io/* | gcr.io/* | ghcr.io/*"
