apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-alerts
  labels:
    app: shop
spec:
  groups:
    - name: shop.rules
      rules:
        - alert: ShopApiRestarting
          expr: kube_pod_container_status_restarts_total{pod=~"shop-api.*"} > 3
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "shop-api нестабилен (много рестартов)"
        - alert: ShopPostgresNotReady
          expr: kube_pod_status_ready{pod=~"shop-postgres-.*",condition="true"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "под postgres не готов"
        - alert: ShopApiReplicasUnavailable
          expr: kube_deployment_status_replicas_unavailable{deployment="shop-api"} > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "у shop-api есть недоступные реплики"