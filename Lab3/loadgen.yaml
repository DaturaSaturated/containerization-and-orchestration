apiVersion: v1
kind: Pod
metadata:
  name: loadgen
  labels:
    app: loadgen
    version: v1
spec:
  containers:
  - name: loadgen
    image: docker.io/library/shop-api:v3
    imagePullPolicy: IfNotPresent
    command: ["/bin/sh", "-c", "while true; do if out=$(wget -qO- http://shop-api/health 2>/dev/null); then echo 200; else echo FAIL; fi; sleep 0.2; done"]
    resources:
      limits:
        cpu: 50m
        memory: 64Mi
    securityContext:
      privileged: false
      runAsNonRoot: true
