apiVersion: v1
kind: Pod
metadata:
  name: bad-untrusted
  labels:
    app: bad
    version: v1
spec:
  containers:
  - name: nginx
    image: evil.com/nginx:latest
    securityContext:
      privileged: false
      runAsNonRoot: true
    resources:
      limits:
        memory: "128Mi"
        cpu: "100m"
