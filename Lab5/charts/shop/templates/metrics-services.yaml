apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-metrics-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: shop
    shop.io/metrics: postgres
spec:
  clusterIP: None
  selector:
    cnpg.io/cluster: shop-postgres
    cnpg.io/podRole: instance
  ports:
  - name: metrics
    port: 9187
    targetPort: 9187
    protocol: TCP
