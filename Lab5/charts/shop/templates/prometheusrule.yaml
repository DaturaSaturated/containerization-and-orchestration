apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-network
  labels:
    app.kubernetes.io/part-of: shop
spec:
  groups:
  - name: shop-network
    rules:
    - alert: ShopPolicyDeniedTraffic
      expr: increase(hubble_drop_total{reason="POLICY_DENIED"}[2m]) > 0
      labels:
        severity: warning
      annotations:
        summary: "Policy-denied traffic"
        description: "Hubble counted POLICY_DENIED drops in last 2m."

    - alert: ShopTCPConnectionDrops
      expr: increase(hubble_flows_processed_total{type="Drop",verdict="DROPPED",protocol="TCP"}[2m]) > 5
      labels:
        severity: warning
      annotations:
        summary: "TCP connection drops"
        description: "Spike of dropped TCP flows: connections are not passing."

    - alert: CoreDNSDownOrMissing
      expr: (count(up{job=~".*coredns.*"}) == 0) or (min(up{job=~".*coredns.*"}) == 0)
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "CoreDNS down or missing"
        description: "No healthy CoreDNS scrape target in Prometheus."
