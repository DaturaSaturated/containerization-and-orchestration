{{- $fault := default "none" .Values.networkPolicy.fault -}}
{{- $api := "shop-api" -}}{{- $worker := "shop-worker" -}}
{{- if eq $fault "app-label" }}{{- $api = "shop-apii" -}}{{- $worker = "shop-workeri" -}}{{- end }}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-allow-app-to-postgres-egress
spec:
  podSelector:
    matchExpressions:
    - { key: app, operator: In, values: [{{ $api }}, {{ $worker }}] }
  policyTypes: [Egress]
  egress:
  - to:
    - podSelector:
        matchLabels: { cnpg.io/cluster: shop-postgres, cnpg.io/podRole: instance }
    ports: [ { protocol: TCP, port: 5432 } ]
{{- end }}
