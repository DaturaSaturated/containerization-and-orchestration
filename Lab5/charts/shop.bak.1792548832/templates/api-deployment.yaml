apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app: shop-api
    version: {{ .Values.api.image | splitList ":" | last }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: shop-api
  template:
    metadata:
      labels:
        app: shop-api
        version: {{ .Values.api.image | splitList ":" | last }}
    spec:
      {{- if .Values.priorityClasses.enabled }}
      priorityClassName: {{ .Release.Name }}-critical
      {{- end }}
      {{- if .Values.api.spread.enabled }}
      {{- if eq .Values.api.spread.mechanism "topologySpreadConstraints" }}
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: {{ if eq .Values.api.spread.mode "hard" }}DoNotSchedule{{ else }}ScheduleAnyway{{ end }}
        labelSelector:
          matchLabels:
            app: shop-api
      {{- else if eq .Values.api.spread.mechanism "podAntiAffinity" }}
      affinity:
        podAntiAffinity:
          {{- if eq .Values.api.spread.mode "hard" }}
          requiredDuringSchedulingIgnoredDuringExecution:
          {{- else }}
          preferredDuringSchedulingIgnoredDuringExecution:
          {{- end }}
          - labelSelector:
              matchLabels:
                app: shop-api
            topologyKey: kubernetes.io/hostname
      {{- end }}
      {{- end }}
      containers:
      - name: api
        image: {{ .Values.api.image }}
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: HEALTH_FAIL
          value: {{ .Values.api.healthFail | default "false" | quote }}
        envFrom:
        - configMapRef:
            name: {{ .Release.Name }}-config
        - secretRef:
            name: {{ .Release.Name }}-db
        resources:
          requests:
            cpu: {{ .Values.api.resources.requests.cpu }}
            memory: {{ .Values.api.resources.requests.memory }}
          limits:
            cpu: {{ .Values.api.resources.limits.cpu }}
            memory: {{ .Values.api.resources.limits.memory }}
        securityContext:
          privileged: false
          runAsNonRoot: true
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5