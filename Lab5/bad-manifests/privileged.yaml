apiVersion: v1
kind: Pod
metadata:
  name: bad-privileged
  labels:
    app: bad
    version: v1
spec:
  containers:
  - name: nginx
    image: docker.io/nginx:latest
    securityContext:
      privileged: true
      runAsNonRoot: true
    resources:
      limits:
        memory: "128Mi"
        cpu: "100m"
